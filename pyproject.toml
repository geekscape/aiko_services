[project]
name = "aiko_services"
version = "0.7"
readme = "ReadMe.md"
description = "Distributed embedded service framework for A.I and robotics"
requires-python = ">=3.9.0,<3.15"

authors = [
    {name = "Andy Gelme", email = "geekscape@gmail.com"}
]

keywords = [
    "agents", "ai", "distributed", "embedded", "framework",
    "internet of things", "machine learning", "media", "robotics"
]

license = "Apache-2.0"
license-files = ["LICENCE"]

# See: https://pypi.org/classifiers
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    "asciimatics>=1.15.0",
    "avro>=1.12.0",
    "avro-validator>=1.2.1",
    "click>=8.1.7",
    "numpy>=1.26.4",
    "paho-mqtt>=1.6.1,<2.0.0",
    # Pinned binary deps: the versions below 3.14 are the long-tested
    # pins, which publish no cp314 wheels. Python 3.14 uses the first
    # wheel-bearing releases instead (environment markers keep the
    # tested pins untouched for 3.9-3.13)
    "Pillow~=10.4.0; python_version < '3.14'",
    "Pillow>=11.3; python_version >= '3.14'",
    "psutil~=6.0.0; python_version < '3.14'",
    "psutil>=7.0; python_version >= '3.14'",
    "pyperclip~=1.9.0",
    "pytest~=8.3.4",
    "pyzmq~=26.2.0; python_version < '3.14'",
    "pyzmq>=27.0; python_version >= '3.14'",
    "requests~=2.32.3",
    "transitions~=0.9.2",
    "wrapt~=1.16.0; python_version < '3.14'",
    "wrapt>=1.17.3; python_version >= '3.14'"
]

[project.optional-dependencies]
test = [
    "validate-pyproject"
]
# opencv-python = ["opencv-python~=4.10.0.84"]
# opencv-contrib-python = ["opencv-contrib-python~=4.10.0.84"]
# linux = ["PyAudio~=0.2.14"]
# macosx = ["PyAudio~=0.2.14"]
# sounddevice = ["sounddevice~=0.5.0"]

[project.scripts]
# aiko = "aiko_services.main.cli:main"
aiko_dashboard = "aiko_services.main.dashboard:main"
aiko_hyperspace = "aiko_services.main.hyperspace:main"
aiko_pipeline = "aiko_services.main.pipeline:main"
aiko_process = "aiko_services.main.process_manager:main"
aiko_registrar = "aiko_services.main.registrar:main"
aiko_storage_file = "aiko_services.main.storage.storage_file:main"

# [tool.pyrefly]
# project-includes = ["**/*"]
# project-excludes = [
#     "**/node_modules",
#     "**/__pycache__",
#     "**/*venv/**/*",
# ]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
packages = ["src/aiko_services"]
exclude = [
    "cache",
    "src/aiko_services/archive",
    "src/aiko_services/elements/media/data",
    "src/aiko_services/examples",
    "venv*"
]

# https://hatch.pypa.io/latest/config/build/#build-targets
[tool.hatch.build.targets.wheel]
packages = ["src/aiko_services"]
exclude = [
    "cache",
    "src/aiko_services/archive",
    "src/aiko_services/elements/media/data",
    "src/aiko_services/examples",
    "venv*"
]

[tool.hatch.envs.default]
features = ["test"]

[tool.hatch.envs.default.scripts]
test = [
    "pytest {args:src/aiko_services/tests/unit}",
    "validate-pyproject pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["src/aiko_services/tests/unit"]
