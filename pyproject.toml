[project]
name = "aiko_services"
version = "0.7"
readme = "ReadMe.md"
description = "Distributed embedded service framework for A.I and robotics"
requires-python = ">=3.9.0,<=3.14.6"

authors = [
    {name = "Andy Gelme", email = "geekscape@gmail.com"}
]

keywords = [
    "agents", "ai", "distributed", "embedded", "framework",
    "internet of things", "machine learning", "media", "robotics"
]

licence-files = ["LICENCE"]

# See: https://pypi.org/classifiers
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    "asciimatics~=1.15.0",
    "avro~=1.12.0",
    "avro-validator~=1.2.1",
    "click~=8.1.7",
    "numpy>=1.26.4",
    "paho-mqtt>=1.6.1,<2.0.0",
    "Pillow~=10.4.0",
    "psutil~=6.0.0",
    "pyperclip~=1.9.0",
    "pyzmq~=26.2.0",
    "requests~=2.32.3",
    "transitions~=0.9.2",
    "wrapt~=1.16.0"
]

[project.optional-dependencies]
test = [
    "pytest",
    "ruff"
]
# opencv-python = ["opencv-python~=4.10.0.84"]
# opencv-contrib-python = ["opencv-contrib-python~=4.10.0.84"]
# linux = ["PyAudio~=0.2.14"]
# macosx = ["PyAudio~=0.2.14"]
# sounddevice = ["sounddevice~=0.5.0"]

[project.scripts]
# aiko = "aiko_services.main.cli:main"
aiko_dashboard = "aiko_services.main.dashboard:main"
aiko_hyperspace = "aiko_services.main.hyperspace:main"
aiko_pipeline = "aiko_services.main.pipeline:main"
aiko_process = "aiko_services.main.process_manager:main"
aiko_registrar = "aiko_services.main.registrar:main"
aiko_storage_file = "aiko_services.main.storage.storage_file:main"

[tool.hatch]

# [tool.pyrefly]
# project-includes = ["**/*"]
# project-excludes = [
#     "**/node_modules",
#     "**/__pycache__",
#     "**/*venv/**/*",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
packages = ["src/aiko_services"]
exclude = [
    "cache",
    "src/aiko_services/archive",
    "src/aiko_services/elements/media/data",
    "src/aiko_services/examples",
    "venv*"
]

# https://hatch.pypa.io/latest/config/build/#build-targets
[tool.hatch.build.targets.wheel]
packages = ["src/aiko_services"]
exclude = [
    "cache",
    "src/aiko_services/archive",
    "src/aiko_services/elements/media/data",
    "src/aiko_services/examples",
    "venv*"
]

[tool.hatch.envs.default]
path = ".hatch"
features = ["test"]

[tool.hatch.envs.default.scripts]
test = [
    "- check", # TODO(nic): remove leading `-` and make this enforcing rather than advisory
    "pytest {args:tests}",
]
check = [
    "ruff format --check src/aiko_services",
    "ruff check src/aiko_services"
]
format = [
    "ruff format src/aiko_services",
    "ruff check --select I,F401 --fix-only --show-fixes src/aiko_services"
]

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120
output-format = "full"
target-version = "py39"
exclude = [
    ".git",
    ".hatch",
    "__pycache__",
]

[tool.ruff.lint]
select = ["B", "C9", "D", "E", "F", "I", "S", "W"]
ignore = [
    "B905", # Allow `zip()` without an explicit `strict=` parameter
    "D10", # ignore missing docstrings (for now)
    "D202", # No blank lines allowed after function docstring
    "D203", # Allow One Blank Line Before Class
    "D213", # Allow "Multi-line docstring summary should start at the second line"
    "D418", # Allow @overload funcs to contain docstrings
    "F403", # Allow star imports (for now)
    "F405", # Allow undefined locals when star imports used (for now)
    "S101", # Allow use of `assert`, pytest doesn't do much without it
    "S110", # Allow try/except/pass
]
mccabe.max-complexity = 13

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (unused imports) in all `__init__.py` files
"__init__.py" = ["F401"]
