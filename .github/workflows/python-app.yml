# This workflow will install Python dependencies, run tests and lint across
# the supported Python versions (see "requires-python" in pyproject.toml).
# Each version runs on "ubuntu-latest", except where that image provides no
# interpreter for it (see the matrix below)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
        # "actions/python-versions" builds Python 3.9 for Ubuntu 24.04 and
        # no later, and "ubuntu-latest" became Ubuntu 26.04 in November
        # 2026, so the 3.9 job pins the newest image that provides it.
        # When Ubuntu 24.04 is retired, a 3.9 interpreter has to come from
        # elsewhere: a "python:3.9" container, or "uv python install 3.9",
        # which build independently of the runner image
          - os: "ubuntu-24.04"
            python-version: "3.9"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -e .
    - name: Lint with flake8
      run: |
        # Enforce critical syntax and runtime-related issues ...
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        # Enforce coding standards (complexity, line length) ...
        # flake8 . --count --exit-zero --max-complexity=10 --max-line-length=80 --statistics
    - name: Test with pytest
      run: |
        pytest
